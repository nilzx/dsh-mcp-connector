name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:

permissions: {}

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.route.outputs.publish }}
      tag: ${{ steps.route.outputs.tag }}
      prerelease: ${{ steps.route.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate event and version
        id: route
        run: node scripts/release-route.mjs
      # dsh 0.2.2-rc.5 declares Node >=24.9; use a supported host runtime.
      - name: Install isolated reviewed host modules
        run: |
          npm install --prefix "$RUNNER_TEMP/host" --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.5 esbuild@0.28.2
          test ! -e "$RUNNER_TEMP/host/node_modules/@deepseek-ai/dsh/node_modules"
          ln -s ../.. "$RUNNER_TEMP/host/node_modules/@deepseek-ai/dsh/node_modules"
          node contrib/dsh-session-admission/build.mjs \
            "$RUNNER_TEMP/host/node_modules/@deepseek-ai/dsh" \
            "$RUNNER_TEMP/admission" "$RUNNER_TEMP/host/node_modules/esbuild/lib/main.js"
      - name: Run complete suite with real host modules (no skips)
        run: |
          set -o pipefail
          export DSH_CORDIS_MODULE="$RUNNER_TEMP/host/node_modules/@deepseek-ai/cordis/lib/index.js"
          export DSH_SESSION_ADMISSION_MODULE="$RUNNER_TEMP/admission/session/index.js"
          export DSH_SESSION_MODULE="$RUNNER_TEMP/host/node_modules/@deepseek-ai/dsh-session/lib/index.js"
          export DSH_LLM_MODULE="$RUNNER_TEMP/host/node_modules/@deepseek-ai/dsh-llm/lib/index.js"
          export DSH_TOOLS_PIPELINE_MODULE="$RUNNER_TEMP/host/node_modules/@deepseek-ai/dsh-tools/lib/pipeline.js"
          export DSH_STORAGE_DOMAIN_MODULE="$RUNNER_TEMP/host/node_modules/@deepseek-ai/dsh-storage-domain/lib/index.js"
          node --test --test-reporter=tap test/*.test.js | tee "$RUNNER_TEMP/connector-tests.tap"
          grep -qx '# fail 0' "$RUNNER_TEMP/connector-tests.tap"
          grep -qx '# skipped 0' "$RUNNER_TEMP/connector-tests.tap"
      - name: Pack and install the candidate
        run: |
          mkdir -p dist "$RUNNER_TEMP/connector-install"
          npm pack --pack-destination dist
          mv dist/*.tgz dist/candidate.tgz
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/connector-install" "$PWD/dist/candidate.tgz"
          test -f "$RUNNER_TEMP/connector-install/node_modules/@nilzx/dsh-mcp-connector/contrib/dsh-session-admission/build.mjs"
          test -f "$RUNNER_TEMP/connector-install/node_modules/@nilzx/dsh-mcp-connector/contrib/dsh-session-admission/host.patch"
          test -f "$RUNNER_TEMP/connector-install/node_modules/@nilzx/dsh-mcp-connector/docs/HOST-CONTRACT-v1.md"
          cd dist
          sha256sum candidate.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-package
          path: dist/
          if-no-files-found: error

  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: verified-package
          path: dist
      - name: Verify candidate digest
        run: cd dist && sha256sum -c SHA256SUMS
      - name: Install supported npm publisher
        run: npm install -g npm@^11.15.0
      - name: Publish verified tarball
        env:
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: npm publish dist/candidate.tgz --access public --tag "$RELEASE_TAG" --provenance
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.package.outputs.prerelease }}
        run: |
          args=()
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME" "${args[@]}"
