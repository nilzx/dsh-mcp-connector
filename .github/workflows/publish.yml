name: Publish

# Pushing a version tag is the release action: the tag must match
# package.json, the suite must pass, and npm receives the package.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "
            const version = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (version !== tag) {
              console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + version);
              process.exit(1);
            }
          "

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
