name: Publish

# Pushing a version tag is the release action: the tag must match
# package.json, the suite must pass, and npm receives the package through
# OpenID Connect — the repository stores no long-lived npm token.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  # The release job writes the GitHub release and reads the repository.
  contents: write
  # npm trusted publishing: GitHub mints a short-lived OIDC token per run.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing only accepts GitHub-hosted runners.
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "
            const version = require('./package.json').version;
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            if (version !== tag) {
              console.error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json version ' + version);
              process.exit(1);
            }
          "

      # npm 11.15+ exchanges the workflow's OIDC token for a short-lived
      # publish token; pnpm 12's publisher does not implement that exchange.
      - name: Use a publisher with trusted publishing support
        run: |
          npm install -g npm@^11.15.0
          npm --version

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
